<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Usuario</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="assets/logo.png" alt="Logo" /></a>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="#" id="logout-btn" class="btn-primary">Cerrar Sesión</a></li>
        </ul>
    </nav>

    <section class="section" style="max-width: 800px; margin: 2rem auto;">
        <h2 class="section-title" id="welcome-msg">Bienvenido</h2>
        <!-- Progress Form -->
        <form id="progress-form">
            <div class="form-group">
                <label for="date">Fecha</label>
                <input type="date" id="date" name="date" required />
            </div>
            <div class="form-group">
                <label for="weight">Peso (kg)</label>
                <input type="number" step="0.1" id="weight" name="weight" required />
            </div>
            <div class="form-group">
                <label for="height">Altura (cm)</label>
                <input type="number" id="height" name="height" required />
            </div>
            <div class="form-group">
                <label for="fat">% Grasa Corporal (opcional)</label>
                <input type="number" step="0.1" id="fat" name="fat" />
            </div>
            <div class="form-group">
                <label>Áreas de Progreso</label>
                <div>
                    <input type="checkbox" id="strength" name="areas" value="Fuerza" />
                    <label for="strength">Fuerza</label>
                </div>
                <div>
                    <input type="checkbox" id="endurance" name="areas" value="Resistencia" />
                    <label for="endurance">Resistencia</label>
                </div>
                <div>
                    <input type="checkbox" id="speed" name="areas" value="Velocidad" />
                    <label for="speed">Velocidad</label>
                </div>
                <div>
                    <input type="checkbox" id="technique" name="areas" value="Técnica" />
                    <label for="technique">Técnica</label>
                </div>
            </div>
            <button type="submit" class="btn-primary">Añadir Progreso</button>
        </form>
    </section>

    <!-- Progress Table -->
    <section class="section" style="max-width: 1000px; margin: 2rem auto;">
        <h3 class="section-title">Historial de Progreso</h3>
        <table id="progress-table" style="width:100%; border-collapse: collapse;">
            <thead>
                <tr style="background: var(--color-gray);">
                    <th>Fecha</th>
                    <th>Peso</th>
                    <th>Altura</th>
                    <th>% Grasa</th>
                    <th>Áreas</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <!-- Chart -->
    <section class="section" style="max-width: 1000px; margin: 2rem auto;">
        <h3 class="section-title">Evolución de Peso</h3>
        <canvas id="weightChart" height="200"></canvas>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 Boxing & Fitness Training System.</p>
        </div>
    </footer>
</body>
</html>
