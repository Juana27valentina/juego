<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Registro</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="assets/logo.png" alt="Logo" /></a>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
        </ul>
    </nav>

    <section class="section" style="max-width: 500px; margin: 2rem auto;">
        <h2 class="section-title" id="form-title">Login</h2>
        <form id="auth-form">
            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" required minlength="2" />
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required />
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="6" />
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">Ingresar</button>
        </form>
        <p style="margin-top:1rem; text-align:center;">
            <span id="toggle-text">¿No tienes cuenta? <a href="#" id="toggle-link">Regístrate</a></span>
        </p>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 Boxing & Fitness Training System.</p>
        </div>
    </footer>
</body>
</html>
