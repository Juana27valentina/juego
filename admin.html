<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Usuarios - EduDash</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <!-- SheetJS para exportar a Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; transition: 0.3s; color: white;}
        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: #3111cc; }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #01925d; }
        .btn-danger { background-color: var(--danger); }
        .btn-edit { background-color: var(--warning); color: #fff; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 400px; max-width: 90%; }
        .modal-content h3 { margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 500;}
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-secondary { background-color: #e2e8f0; color: var(--text-main); }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-chart-line"></i> EduDash</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html"><i class="fa-solid fa-house"></i> Resumen General</a>
                <a href="admin.html" class="active"><i class="fa-solid fa-users-gear"></i> Administrar Usuarios</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1>Administración de Usuarios (Tiquetera)</h1>
            </header>

            <section class="table-section">
                <div class="admin-header">
                    <h3>Lista de Usuarios</h3>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-success" id="btn-export-excel"><i class="fa-solid fa-file-excel"></i> Exportar a Excel</button>
                        <button class="btn btn-primary" id="btn-new-user"><i class="fa-solid fa-user-plus"></i> Nuevo Usuario</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table id="users-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre Completo</th>
                                <th>Email</th>
                                <th>Cargo</th>
                                <th>Departamento</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Se llena por JS desde la DB -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Formulario Usuario -->
    <div class="modal" id="user-modal">
        <div class="modal-content">
            <h3 id="modal-title">Nuevo Usuario</h3>
            <form id="user-form">
                <input type="hidden" id="user-id">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="user-name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="user-email" required>
                </div>
                <div class="form-group">
                    <label>Cargo</label>
                    <input type="text" id="user-cargo" required>
                </div>
                <div class="form-group">
                    <label>Departamento</label>
                    <select id="user-depto" required>
                        <option value="Coordinación Académica">Coordinación Académica</option>
                        <option value="Equipo Pedagógico">Equipo Pedagógico</option>
                        <option value="Dirección">Dirección</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="btn-close-modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
